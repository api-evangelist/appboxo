source: https://docs.boxo.io/host-apps/ErrorCodes
format: custom
envelope:
  fields:
    - error_code   # machine-readable string identifier
    - error_message
  notes: >
    Boxo returns errors as a JSON envelope carrying an `error_code` string (and
    often `error_message`). On host-app integration endpoints the host returns
    `{"error_code": "..."}` with HTTP 200; the Boxo complete-order webhook returns
    HTTP 400 with `error_code`/`error_message`. This is NOT RFC 9457 problem+json.
