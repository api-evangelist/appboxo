aid: appboxo
name: Appboxo
description: >-
  Appboxo (Boxo) is a superapp / miniapp platform that lets any mobile app embed third-party
  services as native-feeling miniapps through a single integration. It ships host-app SDKs for
  iOS, Android, Flutter, React Native, Expo and Capacitor plus a web JavaScript SDK bridge that
  exposes native UI (tab bar, navigation bar, action sheets, QR reader, maps) and device
  capabilities to web miniapps. The Boxo Platform provides server-to-server integrations —
  Boxo Connect (SSO / user authorization), Boxo Payments (in-app order payments with host-app
  callbacks), custom events, and configurable request signaturing (RSA2 / HMAC / ECDSA) — so a
  host app can launch new services (eSIM, marketplace, remittance, insurance, travel, loyalty)
  far faster than building them in-house. Appboxo is a portfolio company of 500 Global.
